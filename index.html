<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Split — expense splitter</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <main class="app">
      <h1>Split</h1>
      <p class="members">Members: <span id="members"></span></p>

      <form id="expense-form">
        <input
          id="expense-input"
          type="text"
          placeholder="e.g. Dinner 42.50 eur"
          required
        />
        <button type="submit">Add expense</button>
      </form>

      <h2>Expenses</h2>
      <ul id="expenses"></ul>
      <p class="stats">Total: <span id="total">0</span></p>

      <h2>Settle up</h2>
      <ul id="settlement"></ul>
    </main>
    <script type="module" src="/js/app.ts"></script>
  </body>
</html>
